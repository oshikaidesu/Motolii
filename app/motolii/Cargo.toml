[package]
name = "motolii"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

# 製品 front(裁定251/254 — 裁定5「front は iced のみ」を覆した)。
#
# 旧名 `r7-makepad-panel`、旧所在 `next/probes/`。probe として生まれ、製品に
# なっても身分だけ probe のまま残っていたのを 2026-08-27 に是正した。空の
# `[workspace]` で独立していたのも同じ話 — あれは workspace に属さないための
# 逃げ口で、結果として CI がこの crate を一度も見なかった。今は `app/` の
# workspace の一員である。
#
# 意味の正本は store / shell-state / engine。`motolii-shell`(凍結された iced
# アセンブラ)は引かない。
[dependencies]
# platform observation だけを持つ薄い fork。Motolii の方針は src/gesture_input.rs
# の後ろに置く(fork へ方針を持ち込まない)。
makepad-widgets = { git = "https://github.com/oshikaidesu/makepad.git", rev = "447dcc3ce2896cc5deec44e013009ef5855caa7f" }
wgpu = "29.0.4"
motolii-store.workspace = true
motolii-shell-state.workspace = true
motolii-engine.workspace = true
motolii-audio.workspace = true
motolii-fixture.workspace = true
# 投影と積み替えの計算だけ。iced view 層(`motolii-timeline-pane`)は front から
# 一度も呼ばれていないので、計算だけを切り出したこちらを引く。
motolii-timeline-projection.workspace = true
# 素材の口(発注順序2「素材の配置」、`src/browser_surface.rs` の「素材の口」節)。
# 開いた file の寸法・尺・fps は probe に聞く — front は decoder を書かない。
motolii-media.workspace = true
# native file dialog(裁定176、File 束)。**自前のファイルブラウザを作らない。**
# 旧 workspace の `next/Cargo.toml` が既に同じ版を引いていたので、新しい選定では
# なく先例の踏襲。`rfd::` を直接書くのは `browser_surface.rs`(`pick_media_path`)と
# `export_surface.rs`(`pick_export_path`/`pick_still_path`)だけ — grep 1本で
# 境界を確認できる、を旧 `RfdDialogs` から引く。
rfd = "0.15"
# 書き出し(S6)。範囲 export・進捗・中断・静止画はここが持つ(`front` はスレッドと
# 出力先だけ足す)。
motolii-export.workspace = true
# Stage ギズモ(S20)。renderer 非依存、viewport 座標の頂点列を返すだけの薄い借用先
# — 描画基盤は自作しない(`src/stage_chrome.rs` の `DrawGizmoTriangle` が Makepad
# 側で頂点を敷くだけ)。glam は 0.30 系(workspace と一致、transform-gizmo 自身も
# `glam = { version = "0.30", features = ["mint"] }` を引く)なので、
# `transform_gizmo::math::DMat4` 等の再輸出をそのまま使い、glam を直接引かない。
transform-gizmo = "0.5"
# pick 室(TARGET5)の当たり判定だけに使う — `motolii_store::ResolvedLayer.placement.transform`
# が `glam::Affine2` を公開フィールドとして返す(motolii-store 自身の Cargo.toml が
# 同じ理由で直接依存に昇格させた物と同じ版)ので、その値へ `transform_point2` を呼ぶために
# workspace の版をそのまま引く。**transform-gizmo 側の `gmath`(独自の glam の写し)とは
# 別物** — stage_chrome.rs はこちらを引かず、境界を混ぜない。
glam.workspace = true

# ゼロコピー(裁定251)の実体 — 共有 Surface へ直接描く経路。ここは非交渉。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLTexture", "MTLDevice"] }

[lints]
workspace = true
