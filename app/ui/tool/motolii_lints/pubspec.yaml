name: motolii_lints
description: Motolii UI の定規。寸法・余白・文字サイズの生の数字を止め、token へ直す quick fix を出す analyzer plugin。
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  path: ^1.9.0
  analysis_server_plugin: ^0.3.22
  analyzer: ^14.3.0
  analyzer_plugin: ^0.14.16

dev_dependencies:
  analyzer_testing: any
  test: ^1.25.0
  test_reflective_loader: ^0.2.3
