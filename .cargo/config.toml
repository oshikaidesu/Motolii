[build]
target-dir = "motolii/target"

[env]
# 効果(vism/)と re_renderer の shader を disk から読む。re_build_tools はこの env var で
# Environment::DeveloperInWorkspace と判定し、debug かつ非 wasm の時だけ load_shaders_from_disk を立てる。
# 立っていると、vism/ の file を保存した瞬間に窓へ載る(見張りは motolii_probe_watch_effects)。
# release build は焼き込みのまま。rerun 本家の .cargo/config.toml と同じ仕組み。
IS_IN_RERUN_WORKSPACE = "yes"
