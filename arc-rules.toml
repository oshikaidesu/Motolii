# 最小コアの法を、機械が守る形にした物。
#
#   コアは「作品の値・時刻・評価・契約」だけを持つ。絵になる物は全部拡張。
#   (2026-09-20 利用者承認)
#
# 家は 5 つ — doc・render・ui・vism・tests。足すなら消す。
# 依存は上から下へだけ流れる: 編集機 → 拡張 → 描く側 → コア。

[config]
version = 1

# 上ほど外側。依存は後ろの段へしか向けない。
# motolii-doc が最下段 = 誰にも依存しないコア。
[[rules]]
type = "layers"
name = "家の段"
layers = [["motolii-ui"], ["motolii-jobs", "motolii-script", "motolii-edit"], ["motolii-render"], ["motolii-doc"]]
direction = "top-down"
exhaustive = true

# コアは「保存された作品を開いて、ある時刻の値を答える」所まで(2026-09-20 利用者裁定)。
# 描く側も、変える側も知らない。これが破れた時が「コアが太り始めた」瞬間。
[[rules]]
type = "forbidden-dependency"
name = "コアは編集を知らない"
from = "motolii-doc"
to = "motolii-edit"


[[rules]]
type = "forbidden-dependency"
name = "コアは絵を知らない"
from = "motolii-doc"
to = "motolii-render"

# (書き出しと Freeze は実際に描くので、jobs → render は正当。ここに禁止を置かない)

[[rules]]
type = "no-cycles"
name = "no cycles"
scope = "**"

[diagnostics]
unlayered-node = { level = "deny", except = [] }
unmatched-baseline-entry = "warn"
unmatched-except = "warn"
unmatched-pattern = "deny"
