# The whole build on a GitHub Apple silicon Mac, as README.md's "Build and open" does it, then the checks:
# the engine's (filament/check/all.sh) and the window's (flutter analyze; flutter test, which has known failures, only tells).
# Run on each push to main and each pull request that touch the code, and by hand (Actions › build › Run workflow): the
# whole set of tests is the machine's, the few main ones the maker's after each fix (Fowler and Humble's deployment
# pipeline, Continuous Delivery ch. 5: a fast commit stage, then the slower stages; Flutter's Tree hygiene: the tree kept
# green, a change that turns it red mended or taken back first). A push made while one runs waits for it, the latest only
# (Continuous Delivery ch. 5: what came in meanwhile goes through the slow stage together; GitHub's concurrency).
name: build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['filament/**', 'skin/**', 'Brewfile', '.github/workflows/build.yml']
  pull_request:
    paths: ['filament/**', 'skin/**', 'Brewfile', '.github/workflows/build.yml']
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }   # (check/fx_chains.sh reads which effects the last commit changed)
      - uses: actions/cache/restore@v4   # (what the scripts fetch and build, kept between runs while their pins stay)
        id: deps
        with:
          path: |
            filament/third_party/filament_src
            filament/third_party/skia_src
            filament/third_party/thorvg_src
            filament/third_party/physics
            filament/third_party/libtess2
            filament/third_party/ISF-Files
          key: deps-${{ runner.os }}-${{ hashFiles('filament/dawn_probe/*.patch', 'filament/dawn_probe/build.sh', 'filament/dawn_probe/tvg_on_dawn.sh', 'filament/skia.sh', 'filament/jolt.sh', 'filament/libtess2.sh', 'filament/check/isf_all.sh') }}
      - run: brew bundle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
      - run: filament/dawn_probe/build.sh
      - run: filament/edit.sh build.motolii < /dev/null
      - run: brew bundle --file=Brewfile.checks && python3 -m pip install --quiet --break-system-packages pillow numpy   # (what the checks use)
      - run: filament/check/all.sh
      - run: cd skin/book && flutter analyze lib test integration_test --no-fatal-infos --no-fatal-warnings
        if: success() || failure()   # (the window's checks told even when the engine's failed)
      - run: cd skin/book && flutter test --file-reporter json:test_events.json
        if: success() || failure()
      - run: python3 .github/test_failures.py skin/book/test_events.json   # (what the test package counts as not passed while its github lines say nothing: its own json, read)
        if: failure()
      - run: for f in $(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -3); do echo "== $f"; head -c 6000 "$f"; echo; done   # (a test process that died says nothing in its own log: the Mac's crash report says where)
        if: failure()
      - uses: actions/cache/save@v4   # (kept even when a check before failed)
        if: always() && steps.deps.outputs.cache-hit != 'true'
        with:
          path: |
            filament/third_party/filament_src
            filament/third_party/skia_src
            filament/third_party/thorvg_src
            filament/third_party/physics
            filament/third_party/libtess2
            filament/third_party/ISF-Files
          key: ${{ steps.deps.outputs.cache-primary-key }}
