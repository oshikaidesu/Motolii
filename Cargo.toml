# Stage 5 workspace. Default build target is the Flutter native bridge.
[workspace]
resolver = "2"
members = ["motolii/crates/motolii-doc", "motolii/crates/motolii-render", "motolii/ui/native", "motolii/ui/extensions/script", "motolii/ui/extensions/jobs", "motolii/ui/extensions/edit"]
default-members = ["motolii/ui/native"]

[workspace.dependencies]
tobj = "4"
gltf = "1.4"
stl_io = "0.11.0"
smallvec = "1"
wgpu = "29"
peniko = "0.6"
re_renderer = { git = "https://github.com/oshikaidesu/rerun", rev = "d046cd96cc1bd8ab1eef2bcc3bcd536e76aef2cf", default-features = false, features = ["import-gltf", "import-obj", "import-stl"] }
re_log = { git = "https://github.com/oshikaidesu/rerun", rev = "d046cd96cc1bd8ab1eef2bcc3bcd536e76aef2cf", features = ["setup"] }
# 物理の解き手は借りる(自作しない): 積み上げの warm start・摩擦・joint・snapshot を持っている。
# 先例: Cavalry は Box2D。Rapier はその Rust 版で、状態の保存と復元がある(Apache-2.0)。
rapier3d = "0.32"
parry2d = "0.26"
# 道の平滑化は既製品(曲がりに合わせて点を割る)。先例: vello / re_renderer も lyon の族を使う。
lyon_geom = "1.0"
macaw = "0.30"
glam = "0.30"
transform-gizmo = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp", "hdr", "exr"] }
moxcms = "0.8"
base64 = "0.22"
ffmpeg-sidecar = "2.5"
re_video = { git = "https://github.com/oshikaidesu/rerun", rev = "d046cd96cc1bd8ab1eef2bcc3bcd536e76aef2cf", features = ["lavc"] }
naga = { version = "29.0", default-features = false, features = ["glsl-in", "wgsl-out"] }
pollster = "0.4"
re_importer = { git = "https://github.com/oshikaidesu/rerun", rev = "d046cd96cc1bd8ab1eef2bcc3bcd536e76aef2cf", default-features = false }
re_sdk_types = { git = "https://github.com/oshikaidesu/rerun", rev = "d046cd96cc1bd8ab1eef2bcc3bcd536e76aef2cf", default-features = false }
re_types_core = { git = "https://github.com/oshikaidesu/rerun", rev = "d046cd96cc1bd8ab1eef2bcc3bcd536e76aef2cf" }
serde = { version = "1", features = ["derive"] }
arrow = { version = "58.3", default-features = false }
sha2 = "0.10"
proptest = "1"
re_byte_size = { git = "https://github.com/oshikaidesu/rerun", rev = "d046cd96cc1bd8ab1eef2bcc3bcd536e76aef2cf" }
re_chunk = { git = "https://github.com/oshikaidesu/rerun", rev = "d046cd96cc1bd8ab1eef2bcc3bcd536e76aef2cf" }
re_chunk_store = { git = "https://github.com/oshikaidesu/rerun", rev = "d046cd96cc1bd8ab1eef2bcc3bcd536e76aef2cf" }
re_build_info = { git = "https://github.com/oshikaidesu/rerun", rev = "d046cd96cc1bd8ab1eef2bcc3bcd536e76aef2cf" }
re_entity_db = { git = "https://github.com/oshikaidesu/rerun", rev = "d046cd96cc1bd8ab1eef2bcc3bcd536e76aef2cf" }
re_log_encoding = { git = "https://github.com/oshikaidesu/rerun", rev = "d046cd96cc1bd8ab1eef2bcc3bcd536e76aef2cf", features = ["encoder", "decoder"] }
re_log_types = { git = "https://github.com/oshikaidesu/rerun", rev = "d046cd96cc1bd8ab1eef2bcc3bcd536e76aef2cf" }
re_query = { git = "https://github.com/oshikaidesu/rerun", rev = "d046cd96cc1bd8ab1eef2bcc3bcd536e76aef2cf" }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
cosmic-text = "0.19"
taffy = "0.13"
rubato = "0.16"
cpal = "0.18"
rtrb = "0.4"
waveform-data = "=0.1.1"
serde_json = "1"
# スクリプトの口(docs/reviews/2026-09-14-script-mouth.md): 中断の口と memory 上限を持つ小さな JS。
rquickjs = "0.13"
thiserror = "2"
quick_cache = "0.7.0"
tempfile = "3"
memmap2 = "0.9"
re_build_tools = { git = "https://github.com/oshikaidesu/rerun", rev = "d046cd96cc1bd8ab1eef2bcc3bcd536e76aef2cf" }

[workspace.lints.rust]
unreachable_pub = "warn"

# 「何か変」を赤緑へ翻訳する。閾値は clippy.toml(借り物)。まず warn、既存は漸進で直す(ironclaw と同じ運用)。
[workspace.lints.clippy]
cognitive_complexity = "warn"
too_many_lines = "warn"
too_many_arguments = "warn"
type_complexity = "warn"



# 16GB機: debug情報を削り、依存(stylo/vello/rerun)だけ最適化して窓を実用速度にする。
# 自前の家も opt-level 1 —— debug のまま窓が重いのは失敗。行番号は残す。
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# 描く側の見張り(zz_watch)用: release の最適化のまま debug-assertions だけ立てる。
# motolii-render の build.rs は cfg!(debug_assertions) で「焼き込み/disk」を分けるので、
# この profile では vism/ を disk から読む(保存が次のコマに載る、cargo 無し)。
[profile.watch]
inherits = "release"
debug-assertions = true

[patch.crates-io]
# re_mp4 0.5.1 は edit list 付き mp4(ffmpeg の VFR 出力)で最後のコマの長さが桁溢れする。fork の 1 行修正。
re_mp4 = { git = "https://github.com/oshikaidesu/re_mp4", rev = "21d5de2a6f5a7c96970b8462d46213eed809a712" }
