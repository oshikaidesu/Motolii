[workspace]
resolver = "2"
members = [
    "plugins/motolii-plugin-opacity",
    "plugins/motolii-plugin-radial-repeater",
    "plugins/motolii-plugin-sine",
    "crates/motolii-core",
    "crates/motolii-eval",
    "crates/motolii-nodes",
    "crates/motolii-plugin",
    "crates/motolii-plugins-firstparty",
    "crates/motolii-render",
    "crates/motolii-export",
    "crates/motolii-cli",
    "crates/motolii-testkit",
    "crates/motolii-media",
    "crates/motolii-gpu",
    "crates/motolii-doc",
    "crates/motolii-audio",
    "crates/motolii-transport",
    "crates/motolii-ui",
    # M-0: iced ホストへの絞め殺し移行の受け皿(2026-08-18裁定)。egui shell と**並走**する。
    "crates/motolii-shell-iced",
    "crates/motolii-input",
    "crates/motolii-web-input",
    "crates/motolii-ui-token-gen",
    # CPU経路の`GridMap`がlayer alphaを担えるかだけを確認する隔離probe。製品binaryには入れない。
    "spikes/rerun-vism-layer-alpha-probe",
    # GPU経路(`copy_gpu_image`)が画素alphaを通すかだけを確認する隔離probe。同上。
    "spikes/rerun-vism-gpu-alpha-probe",
    # E0: Rerunを空間合成の基盤に据えられるか(窓なし描画・カメラ注入・遮蔽)の隔離probe。同上。
    "spikes/rerun-e0-composition-probe",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/oshikaidesu/motolii"

[workspace.dependencies]
motolii-core = { path = "crates/motolii-core" }
motolii-eval = { path = "crates/motolii-eval" }
motolii-gpu = { path = "crates/motolii-gpu" }
motolii-media = { path = "crates/motolii-media" }
motolii-nodes = { path = "crates/motolii-nodes" }
motolii-plugin = { path = "crates/motolii-plugin" }
motolii-plugin-opacity = { path = "plugins/motolii-plugin-opacity" }
motolii-plugin-radial-repeater = { path = "plugins/motolii-plugin-radial-repeater" }
motolii-plugin-sine = { path = "plugins/motolii-plugin-sine" }
motolii-plugins-firstparty = { path = "crates/motolii-plugins-firstparty" }
motolii-render = { path = "crates/motolii-render" }
motolii-export = { path = "crates/motolii-export" }
motolii-cli = { path = "crates/motolii-cli" }
motolii-testkit = { path = "crates/motolii-testkit" }
motolii-doc = { path = "crates/motolii-doc" }
motolii-audio = { path = "crates/motolii-audio" }
motolii-transport = { path = "crates/motolii-transport" }
motolii-ui = { path = "crates/motolii-ui" }
motolii-shell-iced = { path = "crates/motolii-shell-iced" }
motolii-input = { path = "crates/motolii-input" }

# ---------------------------------------------------------------------------
# iced fork(2026-08-18 ホスト移行 M-0)
# ---------------------------------------------------------------------------
# push 済み fork の rev pin(検収で絶対パスから差し替え済み)。rev 更新の検収は
# 新運転席(drive_seat)を回す。ローカル開発で fork を直接触る時だけ一時的に
# path = "~/rust_ae/iced-motolii-20260818" へ向け、commit する前に rev pin へ戻す。
#
# fork の中身(上流との乖離2件・再適用手順・上流 PR 候補である旨)は
# docs/reviews/2026-08-18-iced-fork-seam-ledger.md。
# branch = `motolii/host-seams`、上流 pin = `3de451447bd28217bb535632867550908e29d5d0`。
iced = { git = "https://github.com/oshikaidesu/iced", rev = "73e686ee05efd7d1b61cfea2647186b336d9ab9c", features = ["wgpu", "advanced"] }
# 運転席(headless Simulator)。dev-dependencies 専用。
iced_test = { git = "https://github.com/oshikaidesu/iced", rev = "73e686ee05efd7d1b61cfea2647186b336d9ab9c" }
# fork seam 2(bind group 床)の口。`iced` 本体は `iced_wgpu` を再公開しないので、
# `device_limits::request_min_max_bind_groups` を呼ぶには直接引くしかない。
# 同じ repo・同じ rev なので cargo のグラフ上では iced 内部の iced_wgpu と**同一 package**
# になり、床の static も1つだけである(M-2 Stage 島)。
iced_wgpu = { git = "https://github.com/oshikaidesu/iced", rev = "73e686ee05efd7d1b61cfea2647186b336d9ab9c" }
cargo_metadata = "0.23"
serde = { version = "1", features = ["derive"] }
egui = "0.35"
eframe = { version = "0.35", default-features = false, features = ["wgpu", "x11", "wayland"] }
egui-wgpu = "0.35"
egui-winit = "0.35"
# 運転席(drive_tests)用。egui/egui-wgpu/wgpu と全一致する公式テストハーネス
# (2026-08-16 Timeline再選定の開発動線 第2層)。dev-dependencies 専用。
egui_kittest = { version = "0.35", features = ["wgpu", "snapshot"] }
egui_tiles = "0.16"
# Blitz(HTML/CSS)によるUI面。wgpu 29 に一致するのは vello_hybrid 系のみで、
# classic vello / anyrender_vello は wgpu 26 のため使わない
# (docs/decision-index.md「wgpu 版 罠」の行を参照)。
blitz-dom = { version = "0.3.0-beta.1", features = ["custom-widget", "parallel-construct"] }
blitz-html = "0.3.0-beta.1"
blitz-paint = { version = "0.3.0-beta.1", features = ["custom-widget"] }
blitz-traits = "0.3.0-beta.1"
blitz-net = "0.3.0-beta.1"
anyrender = "0.11"
anyrender_vello_hybrid = "0.8"
vello_hybrid = "0.0.9"
vello_common = "0.0.9"
wgpu_context = "0.7"
keyboard-types = "0.7"
atomic_refcell = "0.1"
rustc-hash = "2"
taffy ={ version = "=0.12.2", default-features = false, features = ["std", "flexbox", "taffy_tree"] }
serde_json = "1"
sha2 = "0.10"
windows-sys = "0.61"
rangemap = "=1.7.1"
priority-queue = { package = "priority-queue", version = "=2.7.0", default-features = false, features = ["std"] }
fs4 = { version = "=1.1.0", default-features = false, features = ["sync"] }
foyer-memory = { version = "=0.22.3" }
vello_svg = { version = "=0.10.0", default-features = false, features = ["wgpu"] }
tempfile = "=3.27.0"
# OS の file dialog(New / Open)。2026-08-03 の P06-C1-MAC probe で
# `rfd` 0.17.2 を固定Macの native seam として縮小採用済み。既に
# `re_viewer_context` 経由で解決済みの同じ版をそのまま使う。
rfd = "0.17"
bytemuck = { version = "1", features = ["derive"] }
vello = "0.9.0"
# N-OVERLAY: 2D overlay renderer(handle/gizmo/outline/grid/safe area/path)。
# base previewとfinal compositeはwgpuが所有し、overlayはdirty時だけraster/upload。
# skia型をdomain/公開plugin契約/Document schemaへ漏らさない。
skia-safe = { version = "0.99.0", default-features = false, features = ["binary-cache"] }

thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
# egui-wgpuとコアで同じwgpuメジャーを共有する。
# 更新時はnative textureと既存device共有を同じPRで再検証する。
wgpu = "29"

# Rerun fork(Spatial Viewer)。2026-08-11裁定でMotoliiはこのViewerのwrapperであり、
# direct `re_renderer` sceneや第二runtimeを作らない。
# 現rev = `motolii/stage-camera-seat`(カメラseam。上流乖離の台帳と再適用手順は
# docs/reviews/2026-08-18-rerun-fork-seam-ledger.md)。rev更新の検収は
# `spikes/rerun-e0-composition-probe` の常設oracleを回す。
# (旧注記の `ui/motolii-rn/native-renderer` は2026-08-16のRN畳み込みで消滅済み)
re_log_types = { git = "https://github.com/oshikaidesu/rerun", rev = "483b855961c0ccab7ef3f3854a8f1b040422572c" }
re_chunk = { git = "https://github.com/oshikaidesu/rerun", rev = "483b855961c0ccab7ef3f3854a8f1b040422572c" }
re_renderer = { git = "https://github.com/oshikaidesu/rerun", rev = "483b855961c0ccab7ef3f3854a8f1b040422572c", default-features = false }
re_sdk_types = { git = "https://github.com/oshikaidesu/rerun", rev = "483b855961c0ccab7ef3f3854a8f1b040422572c" }
re_view_spatial = { git = "https://github.com/oshikaidesu/rerun", rev = "483b855961c0ccab7ef3f3854a8f1b040422572c", default-features = false }
# Stageの幾何→Mesh3D で使う(host_mesh.rs)。版は native-renderer と揃える。
lyon_path = "1.0.19"
lyon_tessellation = "1.0.19"
glam = "0.32"
# Stage の authoring gizmo(rerun_stage/gizmo.rs)。版は native-renderer と揃える。
transform-gizmo = "0.9.0"
winit = "0.30.9"
# blitz-* / anyrender / vello_hybrid の版は上の [workspace.dependencies] に一本化済み。
# 版・feature は実証済みの spikes/blitz-probe/Cargo.toml から写したもので、ここで選び直さない。
# 0.8系/wgpu 29 でないと本体のwgpu 29と型が繋がらない(probe冒頭の注記)。
# blitz_net::Provider は Tokio reactor を要求する(probe 罠2)。
tokio = { version = "1", features = ["time", "rt-multi-thread"] }
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false }
# M2E-6: プロパティテストの正本。エージェントはこれ以外を独断導入しない(監査EN-5)。
proptest = "1"

# 開発の往復用プロファイル。**製品の出力には使わない**(`release` はそのまま残す)。
# 実測(motolii-ui を1行触ってから建て直す):
#   release / bin 4本 27.2s (user 90.6 = 非incremental な codegen が律速)
#   release / bin 1本 23.4s (同上)
#   dev     / bin 4本 49.7s (user 27.8 = リンクと debuginfo が律速)
# release は既定で `incremental = false` なので、1行の変更でも motolii-ui を
# 丸ごと焼き直す。ここでは incremental を入れ、自分のcrateの最適化を落とし、
# 依存だけ opt-level 3 に保つ。
# 日常のビルド/テスト(`cargo test` は test プロファイル = dev 継承)。
# 2026-08-19 実測で「ビルド待ちが開発の律速」と判明したため調整した。
# 既定の `debug = true`(完全 debug 情報)は macOS の object/リンク時間を大きく食う
# (Rust Performance Book の目安で 20〜40% のコンパイル時間差)。
# `line-tables-only` は **backtrace の行番号を残したまま**その大半を落とす
# (Zed の `debug = "limited"` と同じ狙い。出典と比較は
# docs/reviews/2026-08-19-build-speed-investigation.md)。
# 完全な debug 情報が要る時は `--profile dbg` を使う。
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# デバッガでシンボルを追う必要がある時だけ使う待避プロファイル。
[profile.dbg]
inherits = "dev"
debug = "full"

[profile.fast]
inherits = "release"
incremental = true
opt-level = 1
debug = 0

[profile.fast.package."*"]
opt-level = 3
