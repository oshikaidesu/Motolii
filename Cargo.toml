[workspace]
resolver = "2"
members = [
    "plugins/motolii-plugin-opacity",
    "plugins/motolii-plugin-radial-repeater",
    "plugins/motolii-plugin-sine",
    "crates/motolii-core",
    "crates/motolii-eval",
    "crates/motolii-nodes",
    "crates/motolii-plugin",
    "crates/motolii-plugins-firstparty",
    "crates/motolii-render",
    "crates/motolii-export",
    "crates/motolii-cli",
    "crates/motolii-testkit",
    "crates/motolii-media",
    "crates/motolii-gpu",
    "crates/motolii-doc",
    "crates/motolii-audio",
    "crates/motolii-transport",
    "crates/motolii-ui",
    "crates/motolii-input",
    "crates/motolii-web-input",
    "crates/motolii-ui-token-gen",
    # CPU経路の`GridMap`がlayer alphaを担えるかだけを確認する隔離probe。製品binaryには入れない。
    "spikes/rerun-vism-layer-alpha-probe",
    # GPU経路(`copy_gpu_image`)が画素alphaを通すかだけを確認する隔離probe。同上。
    "spikes/rerun-vism-gpu-alpha-probe",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/oshikaidesu/motolii"

[workspace.dependencies]
motolii-core = { path = "crates/motolii-core" }
motolii-eval = { path = "crates/motolii-eval" }
motolii-gpu = { path = "crates/motolii-gpu" }
motolii-media = { path = "crates/motolii-media" }
motolii-nodes = { path = "crates/motolii-nodes" }
motolii-plugin = { path = "crates/motolii-plugin" }
motolii-plugin-opacity = { path = "plugins/motolii-plugin-opacity" }
motolii-plugin-radial-repeater = { path = "plugins/motolii-plugin-radial-repeater" }
motolii-plugin-sine = { path = "plugins/motolii-plugin-sine" }
motolii-plugins-firstparty = { path = "crates/motolii-plugins-firstparty" }
motolii-render = { path = "crates/motolii-render" }
motolii-export = { path = "crates/motolii-export" }
motolii-cli = { path = "crates/motolii-cli" }
motolii-testkit = { path = "crates/motolii-testkit" }
motolii-doc = { path = "crates/motolii-doc" }
motolii-audio = { path = "crates/motolii-audio" }
motolii-transport = { path = "crates/motolii-transport" }
motolii-ui = { path = "crates/motolii-ui" }
motolii-input = { path = "crates/motolii-input" }
cargo_metadata = "0.23"
serde = { version = "1", features = ["derive"] }
egui = "0.35"
eframe = { version = "0.35", default-features = false, features = ["wgpu", "x11", "wayland"] }
egui-wgpu = "0.35"
egui-winit = "0.35"
egui_tiles = "0.16"
# Blitz(HTML/CSS)によるUI面。wgpu 29 に一致するのは vello_hybrid 系のみで、
# classic vello / anyrender_vello は wgpu 26 のため使わない
# (docs/decision-index.md「wgpu 版 罠」の行を参照)。
blitz-dom = { version = "0.3.0-beta.1", features = ["custom-widget", "parallel-construct"] }
blitz-html = "0.3.0-beta.1"
blitz-paint = { version = "0.3.0-beta.1", features = ["custom-widget"] }
blitz-traits = "0.3.0-beta.1"
blitz-net = "0.3.0-beta.1"
anyrender = "0.11"
anyrender_vello_hybrid = "0.8"
vello_hybrid = "0.0.9"
vello_common = "0.0.9"
wgpu_context = "0.7"
keyboard-types = "0.7"
atomic_refcell = "0.1"
rustc-hash = "2"
taffy ={ version = "=0.12.2", default-features = false, features = ["std", "flexbox", "taffy_tree"] }
serde_json = "1"
sha2 = "0.10"
windows-sys = "0.61"
rangemap = "=1.7.1"
priority-queue = { package = "priority-queue", version = "=2.7.0", default-features = false, features = ["std"] }
fs4 = { version = "=1.1.0", default-features = false, features = ["sync"] }
foyer-memory = { version = "=0.22.3" }
vello_svg = { version = "=0.10.0", default-features = false, features = ["wgpu"] }
tempfile = "=3.27.0"
bytemuck = { version = "1", features = ["derive"] }
vello = "0.9.0"
# N-OVERLAY: 2D overlay renderer(handle/gizmo/outline/grid/safe area/path)。
# base previewとfinal compositeはwgpuが所有し、overlayはdirty時だけraster/upload。
# skia型をdomain/公開plugin契約/Document schemaへ漏らさない。
skia-safe = { version = "0.99.0", default-features = false, features = ["binary-cache"] }

thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
# egui-wgpuとコアで同じwgpuメジャーを共有する。
# 更新時はnative textureと既存device共有を同じPRで再検証する。
wgpu = "29"

# Rerun fork(Spatial Viewer)。2026-08-11裁定でMotoliiはこのViewerのwrapperであり、
# direct `re_renderer` sceneや第二runtimeを作らない。revは
# `ui/motolii-rn/native-renderer/Cargo.toml:22-26` と**同じものを使う**(揃えないと二重になる)。
re_log_types = { git = "https://github.com/oshikaidesu/rerun", rev = "8c6865acb9770d7f0ea50319fc985d9c7ceac055" }
re_chunk = { git = "https://github.com/oshikaidesu/rerun", rev = "8c6865acb9770d7f0ea50319fc985d9c7ceac055" }
re_renderer = { git = "https://github.com/oshikaidesu/rerun", rev = "8c6865acb9770d7f0ea50319fc985d9c7ceac055", default-features = false }
re_sdk_types = { git = "https://github.com/oshikaidesu/rerun", rev = "8c6865acb9770d7f0ea50319fc985d9c7ceac055" }
re_view_spatial = { git = "https://github.com/oshikaidesu/rerun", rev = "8c6865acb9770d7f0ea50319fc985d9c7ceac055", default-features = false }
# Stageの幾何→Mesh3D で使う(host_mesh.rs)。版は native-renderer と揃える。
lyon_path = "1.0.19"
lyon_tessellation = "1.0.19"
glam = "0.32"
# Stage の authoring gizmo(rerun_stage/gizmo.rs)。版は native-renderer と揃える。
transform-gizmo = "0.9.0"
winit = "0.30.9"
# blitz-* / anyrender / vello_hybrid の版は上の [workspace.dependencies] に一本化済み。
# 版・feature は実証済みの spikes/blitz-probe/Cargo.toml から写したもので、ここで選び直さない。
# 0.8系/wgpu 29 でないと本体のwgpu 29と型が繋がらない(probe冒頭の注記)。
# blitz_net::Provider は Tokio reactor を要求する(probe 罠2)。
tokio = { version = "1", features = ["time", "rt-multi-thread"] }
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false }
# M2E-6: プロパティテストの正本。エージェントはこれ以外を独断導入しない(監査EN-5)。
proptest = "1"

# 開発の往復用プロファイル。**製品の出力には使わない**(`release` はそのまま残す)。
# 実測(motolii-ui を1行触ってから建て直す):
#   release / bin 4本 27.2s (user 90.6 = 非incremental な codegen が律速)
#   release / bin 1本 23.4s (同上)
#   dev     / bin 4本 49.7s (user 27.8 = リンクと debuginfo が律速)
# release は既定で `incremental = false` なので、1行の変更でも motolii-ui を
# 丸ごと焼き直す。ここでは incremental を入れ、自分のcrateの最適化を落とし、
# 依存だけ opt-level 3 に保つ。
[profile.fast]
inherits = "release"
incremental = true
opt-level = 1
debug = 0

[profile.fast.package."*"]
opt-level = 3
