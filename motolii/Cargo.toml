# 四代目世界のworkspace root。ビルドの家はここ1つ(worktreeでビルドしない、
# レーンは差分を返す。旧世界 app/ next/ crates/ はビルドしない)。
# members は明示 — 逃げ口を塞ぐ。
[package]
name = "motolii"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# vello固定 — vello-hybridはウィンドウ移動中に前フレームの残像が出る
# net: 画像の取得担当(blitz-net)がこのfeatureでしか入らない。無いとimgは
# file:// も data: も静かに空になる(fetchエラーも出ない)。
dioxus-native = { git = "https://github.com/DioxusLabs/blitz", rev = "64eb27853aa2672486b7edf825fb044be78c9db3", default-features = false, features = ["prelude", "system-fonts", "vello", "complex-scripts", "hot-reload", "net"] }
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "64eb27853aa2672486b7edf825fb044be78c9db3", default-features = false, features = ["custom-widget", "autofocus"] }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz", rev = "64eb27853aa2672486b7edf825fb044be78c9db3", default-features = false, features = ["custom-widget"] }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "64eb27853aa2672486b7edf825fb044be78c9db3", default-features = false }
keyboard-types = "0.7"
anyrender = "0.13"
wgpu_context = "0.9"
wgpu = "29"
peniko = "0.6"
bytemuck = { version = "1", features = ["derive"] }

# 同一pin(346a0b3)のMotoliiフォーク。Stage相当の接続の本丸。
re_renderer = { git = "https://github.com/oshikaidesu/rerun", rev = "346a0b3ba93d65924730cd7e76abb357068abb14", default-features = false }
re_log = { git = "https://github.com/oshikaidesu/rerun", rev = "346a0b3ba93d65924730cd7e76abb357068abb14", features = ["setup"] }
macaw = "0.30"
glam = "0.30"

# 実ドキュメント(--fixtureのMV風Document)と製品と同じ補間コード。自作の写経はしない。
motolii-fixture = { path = "core/motolii-fixture" }
motolii-store = { path = "core/motolii-store" }
motolii-vector = { path = "engine/motolii-vector" }
motolii-media = { path = "engine/motolii-media" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
ffmpeg-sidecar = "2.5"

motolii-core.workspace = true
motolii-compositor.workspace = true
re_video.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
pollster = "0.4"
motolii-testkit.workspace = true

[workspace]
resolver = "2"
members = [
    "core/motolii-core",
    "core/motolii-eval",
    "core/motolii-store",
    "core/motolii-fixture",
    "core/motolii-testkit",
    "ui/motolii-tokens-rs",
    "engine/motolii-audio",
    "engine/motolii-compositor",
    "engine/motolii-media",
    "engine/motolii-vector",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.dependencies]
re_chunk = { git = "https://github.com/oshikaidesu/rerun", rev = "346a0b3ba93d65924730cd7e76abb357068abb14" }
re_chunk_store = { git = "https://github.com/oshikaidesu/rerun", rev = "346a0b3ba93d65924730cd7e76abb357068abb14" }
re_entity_db = { git = "https://github.com/oshikaidesu/rerun", rev = "346a0b3ba93d65924730cd7e76abb357068abb14" }
re_log_types = { git = "https://github.com/oshikaidesu/rerun", rev = "346a0b3ba93d65924730cd7e76abb357068abb14" }
re_query = { git = "https://github.com/oshikaidesu/rerun", rev = "346a0b3ba93d65924730cd7e76abb357068abb14" }
re_types_core = { git = "https://github.com/oshikaidesu/rerun", rev = "346a0b3ba93d65924730cd7e76abb357068abb14" }
re_log_encoding = { git = "https://github.com/oshikaidesu/rerun", rev = "346a0b3ba93d65924730cd7e76abb357068abb14", features = ["encoder", "decoder"] }
re_build_info = { git = "https://github.com/oshikaidesu/rerun", rev = "346a0b3ba93d65924730cd7e76abb357068abb14" }
re_build_tools = { git = "https://github.com/oshikaidesu/rerun", rev = "346a0b3ba93d65924730cd7e76abb357068abb14" }
re_byte_size = { git = "https://github.com/oshikaidesu/rerun", rev = "346a0b3ba93d65924730cd7e76abb357068abb14" }
re_renderer = { git = "https://github.com/oshikaidesu/rerun", rev = "346a0b3ba93d65924730cd7e76abb357068abb14", default-features = false }
re_video = { git = "https://github.com/oshikaidesu/rerun", rev = "346a0b3ba93d65924730cd7e76abb357068abb14" }
re_importer = { git = "https://github.com/oshikaidesu/rerun", rev = "346a0b3ba93d65924730cd7e76abb357068abb14", default-features = false }
re_sdk_types = { git = "https://github.com/oshikaidesu/rerun", rev = "346a0b3ba93d65924730cd7e76abb357068abb14", default-features = false }

wgpu = "29.0"
glam = "0.30.10"
macaw = "0.30.0"
pollster = "0.4"

arrow = { version = "58.3", default-features = false }

motolii-core = { path = "core/motolii-core" }
motolii-eval = { path = "core/motolii-eval" }
motolii-store = { path = "core/motolii-store" }
motolii-fixture = { path = "core/motolii-fixture" }
motolii-testkit = { path = "core/motolii-testkit" }
motolii-audio = { path = "engine/motolii-audio" }
motolii-compositor = { path = "engine/motolii-compositor" }
motolii-media = { path = "engine/motolii-media" }
motolii-vector = { path = "engine/motolii-vector" }
# app/ui/ に残る leaf crate(裁定: ui/*3本は app/に残す)。motolii-fixture が
# ラベル配色定数(LABEL_PALETTE_LEN)を借りるためだけに引く — view 型は持たない。
motolii-tokens-rs = { path = "ui/motolii-tokens-rs", default-features = false }

image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
proptest = "1"
serde_json = "1"

# profile は workspace root でしか効かない(member 側に書いても無視される)。
# 16GB機: debug情報を削り、依存(stylo/vello/rerun)だけ最適化して窓を実用速度にする。
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
