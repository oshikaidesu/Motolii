# Legacy Dioxus/Blitz host. Current Flutter UI is ui/; Cargo defaults to ui/native at repository root.
[package]
name = "motolii"
version = "0.0.0"
edition = "2021"
publish = false

[features]
default = ["dynamic"]
dynamic = ["dep:motolii-road"]

[dependencies]
motolii-doc = { path = "crates/motolii-doc" }
motolii-render = { path = "crates/motolii-render" }
motolii-road = { path = "crates/motolii-road", optional = true }
dioxus-native = { workspace = true }
dioxus-devtools = { workspace = true }
dioxus-cli-config = "=0.7.10"
dioxus-asset-resolver = { workspace = true }
dioxus-workbench = { workspace = true }
dioxus-dnd = { workspace = true }
blitz-dom = { workspace = true }
blitz-paint = { workspace = true }
blitz-traits = { workspace = true }
blitz-shell = { workspace = true }
accesskit = "0.24.1"
accesskit_xplat = { git = "https://github.com/DioxusLabs/blitz", rev = "64eb27853aa2672486b7edf825fb044be78c9db3" }
keyboard-types = { workspace = true }
anyrender = { workspace = true }
wgpu_context = { workspace = true }
wgpu = { workspace = true }
peniko = { workspace = true }
glam = { workspace = true }
image = { workspace = true }
base64 = { workspace = true }
ffmpeg-sidecar = { workspace = true }
rfd = { workspace = true }
re_log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# OSのReduce Motionを読む。rfd/winitが既に使う同じAppKit bindingを直接借りる。
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSAccessibility", "NSWorkspace"] }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
# 窓を開けずに窓を触る。上流の器具を借りる。
blitz-test-harness = { git = "https://github.com/DioxusLabs/blitz", rev = "64eb27853aa2672486b7edf825fb044be78c9db3" }

[lints]
workspace = true
