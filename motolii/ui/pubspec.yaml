name: motolii_stage5
description: Motolii Stage 5 Flutter UI
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.2
dependencies:
  flutter:
    sdk: flutter
  docking: ^1.16.2 # the workspace dock
  flutter_scene: ^0.23.0
flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
  assets:
    - flutter_scene_generated/

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
