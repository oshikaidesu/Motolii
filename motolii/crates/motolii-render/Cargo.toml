[package]
name = "motolii-render"
version = "0.0.0"
edition = "2021"
publish = false
build = "build.rs"

[lib]
path = "src/lib.rs"

[dependencies]
rapier3d = { workspace = true }
parry2d = { workspace = true }
lyon_geom = { workspace = true }
motolii-doc = { path = "../motolii-doc", default-features = false }
taffy = { workspace = true }
unicode-segmentation = "=1.13.3"
tobj = { workspace = true }
gltf = { workspace = true }
stl_io = { workspace = true }
smallvec = { workspace = true }
wgpu = { workspace = true }
re_renderer = { workspace = true }
macaw = { workspace = true }
glam = { workspace = true }
image = { workspace = true }
half = "2"
moxcms = { workspace = true }
re_video = { workspace = true }
naga = { workspace = true }
pollster = { workspace = true }
re_importer = { workspace = true }
re_sdk_types = { workspace = true }
re_types_core = { workspace = true }
serde = { workspace = true }
rubato = { workspace = true }
memmap2 = { workspace = true }
ffmpeg-sidecar = { workspace = true }
cpal = { workspace = true }
rtrb = { workspace = true }
waveform-data = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
quick_cache = { workspace = true }
notify = "=8.2.0"
re_log = { workspace = true }
wesl = { version = "=0.4.2", default-features = false }

[build-dependencies]
re_build_tools = { workspace = true }

[dev-dependencies]
motolii-doc = { path = "../motolii-doc", features = ["editing"] }
tempfile = { workspace = true }

[lints]
workspace = true

[features]
shared-bgra-output = []
