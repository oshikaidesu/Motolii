[package]
name = "r7-makepad-panel"
version = "0.1.0"
edition = "2021"
publish = false

# Product front (裁定251/254). Overturns 裁定5 ("front は iced のみ").
# Standalone workspace only because folding into next/ is pending -- not a gate.
# Do not depend on motolii-shell. Meaning owners are store / session / engine.
[workspace]

[dependencies]
# Pin the thin gesture-event fork used by this host. The fork owns platform
# observations only; Motolii policy stays behind src/gesture_input.rs.
makepad-widgets = { git = "https://github.com/oshikaidesu/makepad.git", rev = "447dcc3ce2896cc5deec44e013009ef5855caa7f" }
wgpu = "29.0.4"
motolii-store = { path = "../../core/motolii-store" }
motolii-shell-state = { path = "../../ui/motolii-shell-state" }
motolii-engine = { path = "../../engine/motolii-engine" }
motolii-fixture = { path = "../../core/motolii-fixture" }
# Projection + restack math only. 裁定251 で front が Makepad になった以降、
# `motolii-timeline-pane` の iced view 層は一度も呼ばれていない — その計算だけを
# 切り出した crate へ差し替えた(iced 14 crate + 推移閉包がここで落ちる)。
motolii-timeline-projection = { path = "../../ui/motolii-timeline-projection" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLTexture", "MTLDevice"] }

# 開発中の fork をローカル checkout から引く。push 後は rev を上げてこの節を外す。
[patch."https://github.com/oshikaidesu/makepad.git"]
makepad-widgets = { path = "/Users/member_ottoto/rust_ae/makepad-motolii/widgets" }
