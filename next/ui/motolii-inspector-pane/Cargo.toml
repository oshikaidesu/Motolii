[package]
name = "motolii-inspector-pane"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
iced.workspace = true
motolii-core.workspace = true
motolii-store.workspace = true
# 2026-08-22 追い発注「フォントが選べる・選ばなくても落ちない」: システム
# フォント一覧(family →実在 path)。`text.rs` の既定フォント解決/font pick_list
# が使う(依存ゼロ増分 — `motolii-font-catalog/Cargo.toml` のコメント参照)。
motolii-font-catalog.workspace = true
# デザイン値の外出し(裁定117)。裁定160 切片1 で抽出済みの leaf crate をそのまま
# 依存する — `Colors`/`Dimensions`/`Tokens` は raw 値の直書き禁止の唯一の読み口。
motolii-tokens-rs.workspace = true
# pane 横断スタイルヘルパ(`section_header`/`value_input_style`/`parse_number`/
# `button_style`)は裁定160 切片5でここへ吸い上げられ、切片9で settings-pane
# crate 側(`chrome` module)へ同居した。inspector-pane はその「必要最小の共有」を
# 消費する側 — settings-pane → inspector-pane の依存方向はできても逆はない
# (root → pane の一方向を保つ、切片9の判断に整合。
# docs/reviews/2026-08-21-pane-split-survey.md §2.4)。
motolii-settings-pane.workspace = true
# `Session`(裁定160 切片6→切片7で `motolii-shell-state` crate 化、
# `motolii-timeline-pane` と同じ理由)。`project` が `&Session` を直接取れる
# ようにするための leaf crate 依存 — root(`motolii-shell`)へ依存できない
# pane crate 同士の共通の親(pane split survey §2.3/§5)。
motolii-shell-state.workspace = true

[dev-dependencies]
# 裁定183 taffy 転写(部分適用 — `src/lib.rs::property_row_css` の doc
# 「FINDING」参照): production の `transform_row` へはまだ配線していない
# (`motolii-taffy` 既定の rounding が 150%実測で既存 shell 柵を壊すことを
# 発見したため)ので dev-only。`property_row_css`(mock `.propertyRow` の
# grid-template-columns 宣言)の CSS 文字列は crate 内 unit test
# (`property_row_css_parses_and_declares_the_mock_grid_template`)と
# `tests/property_row_taffy_oracle.rs` の両方が使う。settings-pane の第1号
# (`motolii-settings-pane/Cargo.toml`)と同じ path 直参照(workspace.dependencies
# には無い — members 登録のみ)。
motolii-taffy = { path = "../motolii-taffy" }
# 裁定183 検証層: `.propertyRow` の視覚正本(`next/reference/mocks/
# inspector-library.html`)を blitz-dom+stylo で測り、`TaffyBox` の解と ±1px で
# 突き合わせる oracle(`tests/property_row_taffy_oracle.rs`)。settings-pane の
# oracle(mock 無し)と違い、Inspector は視覚正本を持つのでこの器具が要る —
# `motolii-css-metrics/Cargo.toml` と同じ path 直参照(製品 dep にはしない)。
motolii-css-metrics = { path = "../motolii-css-metrics" }
# 同じ oracle(`tests/property_row_taffy_oracle.rs`)が `TaffyBox` を null
# renderer `()` で直接 layout する手口(`motolii-taffy/tests/layout_oracle.rs`・
# `comp_cells_row_taffy_oracle.rs` と同一)に要る。同じ fork 同 rev(裁定170
# M01 — 別 rev だと iced_core が2本入り型が衝突する)。
iced_core = { git = "https://github.com/oshikaidesu/iced", rev = "73e686ee05efd7d1b61cfea2647186b336d9ab9c" }
iced_widget = { git = "https://github.com/oshikaidesu/iced", rev = "73e686ee05efd7d1b61cfea2647186b336d9ab9c" }
# `motolii-css-metrics` が返す抽出値(`Vec<serde_json::Value>`)の box 幅を読むため。
serde_json.workspace = true
# 裁定168 施工: 値セルの文字が隣接セルへ重ならないことを実 widget bounds で
# 照合する柵(`tests/value_cell_legibility.rs`)。`motolii-shell` の
# `inspector_pixel_fence.rs` と同じ手口(`iced_test::simulator` で `view()` を
# 歩き、実フォントで測った `Target::Text` の bounds を読む)を pane 単体へ
# 小さく写した — shell(write-set 外)を経由せず `inspector_pane::view` を
# 直叩きできる。dev-only、この crate の外へは出さない(shell と同じ扱い)。
# 裁定170(M01)で本体 `iced` と同じ fork 同 rev へ(shell と同じ理由 —
# 別 rev だと iced_core が2本入り Rectangle 等の型が衝突する、merge 後実測)。
iced_test = { git = "https://github.com/oshikaidesu/iced", rev = "73e686ee05efd7d1b61cfea2647186b336d9ab9c" }
