[package]
name = "motolii-stage-pane"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
iced.workspace = true
# Stage 観測カメラ(裁定157)の計算・overlay 描画は `motolii_core::CompSpec`/
# `ResolvedCamera`/`camera_screen_from_world_z0` の合成だけで、新しい投影数学は
# 増やさない(縫い目調査 `docs/reviews/2026-08-21-camera-seam-survey.md` §4)。
motolii-core.workspace = true
# `ObservationCamera`・`Engine::render_frame_with_view_camera`(裁定157)。
# pane split survey §4.2「stage レーン: motolii_core/motolii_engine には依存するが、
# 他 pane 非依存」どおり — この crate だけが GPU 初期化を要る唯一の pane crate。
motolii-engine.workspace = true
motolii-store.workspace = true
# デザイン値の外出し(裁定117)。裁定160 切片1 で抽出済みの leaf crate をそのまま
# 依存する — `Colors`/`Dimensions` は raw 値の直書き禁止の唯一の読み口。
motolii-tokens-rs.workspace = true
# フレーム枠 overlay の affine 計算(`motolii_core::camera_screen_from_world_z0` が
# 返す `glam::Affine2` を直接使う)。`motolii-shell` 側が持っていた「裁定117 が許す
# direct 昇格」の理由をそのまま引き継ぐ(裁定160 切片10でこの crate へ移設)。
glam.workspace = true

[lints]
workspace = true

[dev-dependencies]
# path projection の fixture だけが vector の Contour/Vertex 具体型を組む。
# production の読み口は `motolii-store` の ShapeNode/PathSource 再輸出に留める。
motolii-vector.workspace = true
