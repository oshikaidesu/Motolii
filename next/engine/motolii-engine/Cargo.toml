thiserror.workspace = true
# 裁定171 v2(M4、supervisor 裁定で ALLOWLIST 拡張): `Engine::with_device`/
# `render_*_to_texture` の公開シグネチャが `wgpu::Device`/`Queue`/`Texture`/
