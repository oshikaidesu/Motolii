# リセット後の正本 workspace(2026-08-20裁定)。旧 workspace(../crates, ../plugins,
# ../ui, ../spikes)は歴史証拠であり、ここからは参照しない。
#
# 分離した理由は2つ: (1) 旧 shell 75,293行(egui + iced)を巻き込まずにビルドできる
# (2) 柵が「依存グラフ上ほんとうに切れている」ことを構造で保証する — 旧 workspace の
#     dep policy は宣言だけで、iced 殻が egui 非optional の crate を引いていた。
[workspace]
resolver = "2"
members = [
    "core/motolii-core",
    "core/motolii-eval",
    "core/motolii-store",
    "core/motolii-testkit",
    "engine/motolii-audio",
    "engine/motolii-compositor",
    "engine/motolii-engine",
    "engine/motolii-export",
    "engine/motolii-media",
    "engine/motolii-vector",
    "shell/motolii-shell",
    "ui/motolii-browser-pane",
    "ui/motolii-css-metrics",
    "ui/motolii-export-pane",
    "ui/motolii-icons",
    "ui/motolii-inspector-pane",
    "ui/motolii-keymap",
    "ui/motolii-menubar",
    "ui/motolii-settings-pane",
    "ui/motolii-taffy",
    "ui/motolii-tokens-rs",
    "ui/motolii-verbs",
    "ui/motolii-shell-state",
    "ui/motolii-timeline-pane",
    "ui/motolii-stage-pane",
    "probes/r0-store-edit",
    "probes/r1-frame-throughput",
    "probes/r2-view-projection",
    "probes/r3-pointcloud",
    "probes/r4-widget-timeline",
    "probes/r5-multiwindow",
    "probes/r6-text-shaping",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# ---------------------------------------------------------------------------
# rerun fork(store のみ。viewer 層は引かない)
# ---------------------------------------------------------------------------
# rev は fork `motolii/s2-append-to-store` tip(856f597c = camera seat 483b8559 の
# 直上に `ViewBuilder::main_target()` accessor を1本足したコミット、裁定161 BL1b)。乖離台帳は
# ../docs/reviews/2026-08-18-rerun-fork-seam-ledger.md。
#
# **ここに re_view_spatial / re_ui / re_viewer_context を足さないこと** —
# それらは egui を引き、front が iced だけであるという軸が壊れる。
re_chunk = { git = "https://github.com/oshikaidesu/rerun", rev = "7cca401e6b1de652ab36bcf1652745986ca22cb3" }
re_chunk_store = { git = "https://github.com/oshikaidesu/rerun", rev = "7cca401e6b1de652ab36bcf1652745986ca22cb3" }
re_entity_db = { git = "https://github.com/oshikaidesu/rerun", rev = "7cca401e6b1de652ab36bcf1652745986ca22cb3" }
re_log_types = { git = "https://github.com/oshikaidesu/rerun", rev = "7cca401e6b1de652ab36bcf1652745986ca22cb3" }
re_query = { git = "https://github.com/oshikaidesu/rerun", rev = "7cca401e6b1de652ab36bcf1652745986ca22cb3" }
re_types_core = { git = "https://github.com/oshikaidesu/rerun", rev = "7cca401e6b1de652ab36bcf1652745986ca22cb3" }
re_log_encoding = { git = "https://github.com/oshikaidesu/rerun", rev = "7cca401e6b1de652ab36bcf1652745986ca22cb3", features = ["encoder", "decoder"] }
re_build_info = { git = "https://github.com/oshikaidesu/rerun", rev = "7cca401e6b1de652ab36bcf1652745986ca22cb3" }
re_byte_size = { git = "https://github.com/oshikaidesu/rerun", rev = "7cca401e6b1de652ab36bcf1652745986ca22cb3" }
re_renderer = { git = "https://github.com/oshikaidesu/rerun", rev = "7cca401e6b1de652ab36bcf1652745986ca22cb3", default-features = false }

# 版は rerun の workspace に合わせる。ずれると `IsoTransform` / `Vec3` が別型になる。
wgpu = "29.0"
glam = "0.30.10"
macaw = "0.30.0"
pollster = "0.4"

arrow = { version = "58.3", default-features = false }

# ---------------------------------------------------------------------------
# front
# ---------------------------------------------------------------------------
# 裁定170(2026-08-22, M01)で fork `oshikaidesu/iced` branch `motolii/host-seams`
# へ pin。fork base(= upstream `iced-rs/iced` master)は wgpu 29 系列へ揃っており、
# re_renderer 経由の wgpu(既に 29.0.4)と単一版へ畳める
# (survey: docs/reviews/2026-08-22-iced-015-wgpu29-migration-survey.md §3)。
# seam1(web-sys 完全一致解除)/seam2(`max_bind_groups` の床)は fork に
# 既に入っている(`docs/reviews/2026-08-18-iced-fork-seam-ledger.md`)ので
# コード追加なし。feature 名は 0.14→0.15.0-dev で変更なし(実測)。
iced = { git = "https://github.com/oshikaidesu/iced", rev = "73e686ee05efd7d1b61cfea2647186b336d9ab9c", features = ["wgpu", "advanced", "image", "canvas"] }
# 依存グラフには re_renderer 経由で既に入っている(裁定117 が許す direct 昇格)。
# デザイン値の外出しの debug watch(`motolii-shell/src/tokens.rs`)だけが使う。
notify = "8"
# iced の "image" feature が既に `image`(png codec 込み)を依存グラフへ引いている
# (Cargo.lock 実測: version 0.25.10、png/gif/tiff 等のフル codec)。R3 probe が
# PNG を書き出すのに同じ crate を direct dependency へ昇格するのは、上の notify と
# 同じ「裁定117 が許す direct 昇格」であって新規の依存ではない。png codec だけ要る
# ので default-features は切る。
image = { version = "0.25", default-features = false, features = ["png"] }
# 裁定176(File 束、`docs/reviews/2026-08-22-file-dialog-decision.md`): New
# Project/Save As/Save a Copy/Open の path 選択は native file dialog。
# wraps>移植>スクラッチの自明適用 — 自前 file browser は作らない。
# `motolii-shell` の `FileDialogs` trait(生 rfd 呼び出しは production 実装
# `RfdDialogs` の中だけに閉じる、test は缶詰応答の fake を注入する)からのみ使う。
rfd = "0.15"

# ---------------------------------------------------------------------------
# Motolii 自身(旧 workspace からの移植。再実装ではない)
# ---------------------------------------------------------------------------
motolii-core = { path = "core/motolii-core" }
motolii-eval = { path = "core/motolii-eval" }
motolii-store = { path = "core/motolii-store" }
motolii-testkit = { path = "core/motolii-testkit" }
# 実時間再生 第2切片(A2、2026-08-21): `motolii-shell` が `PlaybackSession`
# (device/producer 結線 + `PlaybackClock`)を叩いて Space Play/Pause を結線する。
motolii-audio = { path = "engine/motolii-audio" }
motolii-compositor = { path = "engine/motolii-compositor" }
motolii-engine = { path = "engine/motolii-engine" }
motolii-export = { path = "engine/motolii-export" }
motolii-media = { path = "engine/motolii-media" }
motolii-vector = { path = "engine/motolii-vector" }
# 裁定160 切片1: `motolii-shell/src/tokens.rs` を抽出した leaf crate(依存ゼロ、
# `notify`/`serde`/`serde_json` のみ)。`motolii-shell` は `pub use` で `tokens`
# path 互換を保つ(docs/reviews/2026-08-21-pane-split-survey.md §2.2/§6 切片1)。
motolii-tokens-rs = { path = "ui/motolii-tokens-rs" }
# 裁定186: SVG アイコン基盤(Material Symbols vendoring + iced svg widget の
# 包み)。iced の "svg" feature はこの crate の Cargo.toml だけが点す。
motolii-icons = { path = "ui/motolii-icons" }
# MB-2(裁定179 D1 根治): header メニューバー(iced_aw menu の vendoring wraps、
# `Item`/`Menu`/`menu_bar` の3口のみ)。
motolii-menubar = { path = "ui/motolii-menubar" }
# keymap 層(発注書「キーは仮置き(keymap 層未実装)」の実体化)。(キー+修飾キー
# +文脈)→動詞id の対応をデータで持つ、依存ゼロの leaf crate。この波では
# crate を建てるだけ——`motolii-shell` の match 文を実際に置き換える配線は
# 次切片(`motolii-keymap` crate 冒頭 doc 参照)。
motolii-keymap = { path = "ui/motolii-keymap" }
# 裁定160 切片9: `motolii-shell/src/settings_pane.rs`(+ 切片5で吸い上げた
# `chrome.rs`)を抽出した pane crate(`motolii-tokens-rs`/`motolii-store`
# だけに依存、pane 同士には依存しない — pane split survey §5 layer 1)。
# `motolii-shell` は `pub use` で `settings_pane` path 互換を保つ
# (docs/reviews/2026-08-21-pane-split-survey.md §6 切片9)。
motolii-settings-pane = { path = "ui/motolii-settings-pane" }
# 裁定160 切片7: `motolii-shell/src/state.rs`(Session/KeySelector)を抽出した
# leaf crate。timeline-pane crate が root(`motolii-shell`)へ依存せずに
# `Session` を読めるようにするための共通の親(pane split survey §2.3/§5)。
motolii-shell-state = { path = "ui/motolii-shell-state" }
# 裁定160 切片7: `motolii-shell/src/timeline/` + 対応する write ロジックを
# 抽出した pane crate(docs/reviews/2026-08-21-pane-split-survey.md §6 切片7)。
motolii-timeline-pane = { path = "ui/motolii-timeline-pane" }
# 裁定160 切片8: `motolii-shell/src/inspector_pane.rs` を抽出した pane crate
# (`motolii-tokens-rs`/`motolii-store`/`motolii-core`/`motolii-settings-pane`
# ——最後は chrome 共有ヘルパ用、pane split survey §2.4 —— に依存、pane 同士は
# `settings-pane → inspector-pane` の一方向のみ)。`motolii-shell` は `pub use`
# で `inspector_pane` path 互換を保つ
# (docs/reviews/2026-08-21-pane-split-survey.md §6 切片8)。
motolii-inspector-pane = { path = "ui/motolii-inspector-pane" }
# 裁定160 切片10: `motolii-shell/src/stage.rs`(観測カメラ、裁定157)+ 対応する
# write ロジック(`observation_preview_source`)を抽出した pane crate。他 pane
# 非依存だが `motolii-engine`(`ObservationCamera`・`render_frame_with_view_camera`)
# には依存する唯一の pane crate(docs/reviews/2026-08-21-pane-split-survey.md
# §4.2「stage レーン」・§6 切片10)。`motolii-shell` は `pub use` で `stage` path
# 互換を保つ。
motolii-stage-pane = { path = "ui/motolii-stage-pane" }
# ζ 縫い目調査(docs/reviews/2026-08-21-browser-seam-survey.md)+裁定162 切片
# B0: Browser pane の骨格 crate。**まだ何も描かない**(`Message` は空 enum、
# `view()` は空 `column![]`)。`motolii-shell` は `Message::Browser(Message)`
# を1本で畳む腕を持つが、`Shell::view` にはまだ組み込まない(描画ゼロ = 挙動
# ゼロ変更の証明、B3 で視覚と一緒に配線)。`motolii-shell` 側は
# `pub use motolii_browser_pane as browser_pane;` で他 pane と同じ命名口を張る。
motolii-browser-pane = { path = "ui/motolii-browser-pane" }

serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"

# 移植した crate の dev-dependencies(不変量試験をそのまま持ってくるため)
proptest = "1"
serde_json = "1"

# 旧 workspace の build-speed 調査(../docs/reviews/2026-08-19-build-speed-investigation.md)の採用値。
# 16GB RAM で swap 2.3GB / pageout 223万回が出たのは debug 情報が stock 完全だったため。
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

# fixture 窓・実窓検分用の高速リビルド profile(2026-08-22 利用者指示「毎回リリース
# ビルドは時間かかるので改善」)。release と同じ opt-level を保ちつつ incremental を
# 有効化 — 手触り判定の忠実度を落とさずに、差分ビルドで回す。初回のみ release 同等の
# 時間を払う。合否判定のテスト(storm/r2 の無罪確認等)は従来どおり --release を使う。
[profile.preview]
inherits = "release"
incremental = true
