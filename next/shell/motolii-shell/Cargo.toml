[package]
name = "motolii-shell"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
iced.workspace = true
# 実時間再生 第2切片(A2、2026-08-21): `transport.rs` が `PlaybackSession`
# (device/producer 結線 + `PlaybackClock`)を開閉する。試験
# (`tests/suite/playback_drive.rs`)も `PlaybackSession::for_simulation`/
# `PlaybackClock`/`PlaybackCounters`/`DeviceWaitLatency` を直接叩くので、
# integration test 側からも見える通常の `[dependencies]` に置く(dev-only の
# `iced_test` とは違う扱い)。
motolii-audio.workspace = true
motolii-core.workspace = true
motolii-engine.workspace = true
motolii-media.workspace = true
motolii-store.workspace = true
# デザイン値の外出し(裁定117)。裁定160 切片1 で `tokens.rs` を crate 抽出、
# `pub use motolii_tokens_rs as tokens;`(lib.rs)で既存 `crate::tokens::` path を
# 維持する。`notify`/`serde`/`serde_json` は tokens.rs 専用の依存だったため、
# 抽出先の `motolii-tokens-rs/Cargo.toml` へ一緒に移した(motolii-shell からは
# 直接使わなくなった)。
motolii-tokens-rs.workspace = true
# MB-2(裁定179 D1 根治): header の箱ボタン列を menubar へ差し替え。メニューの
# 中身(意味)は `src/menu.rs::menus()`、widget は `motolii-menubar` の
# `menu_bar`(iced_aw menu の vendoring wraps、Simulator oracle 済み)。
motolii-menubar.workspace = true
# MB-2+裁定187(icon+tooltip ペア第1号): header 右端の Browser トグル/
# Settings を `Icon::GridView`/`Icon::Settings` の icon ボタンにする。
motolii-icons.workspace = true
# 裁定160 切片9 で `settings_pane.rs`(+ 切片5 の `chrome.rs`)を crate 抽出、
# `pub use motolii_settings_pane as settings_pane;`(lib.rs)で既存
# `crate::settings_pane::` path を維持する。`chrome` は
# `pub(crate) use motolii_settings_pane::chrome;` で同様に再輸出する
# (本 crate 自身が引き続き読む、pane split survey §2.4)。
motolii-settings-pane.workspace = true
# 裁定160 切片7: `state.rs`(Session/KeySelector)を crate 抽出。
# `pub use motolii_shell_state as state;`(lib.rs)で既存 `crate::state::` path を
# 維持する(tokens と同じ手口)。
motolii-shell-state.workspace = true
# 裁定160 切片7: `timeline/` 9ファイル + 対応する write ロジックを crate 抽出。
# `pub use motolii_timeline_pane as timeline;`/`as timeline_pane;`(lib.rs)で
# 既存 path を維持する。
motolii-timeline-pane.workspace = true
# 裁定160 切片8 で `inspector_pane.rs`(+ 私法 Inspector ロジック233行)を crate
# 抽出、`pub use motolii_inspector_pane as inspector_pane;`(lib.rs)で既存
# `crate::inspector_pane::` path を維持する。
motolii-inspector-pane.workspace = true
# 裁定160 切片10: `stage.rs`(観測カメラ、裁定157)+ 対応する write ロジック
# (`observation_preview_source`)を crate 抽出。`pub use motolii_stage_pane as
# stage;`(lib.rs)で既存 `crate::stage::` path を維持する(tokens/timeline と
# 同じ手口)。`glam` は stage.rs 専用の直接依存だったため、抽出先の
# `motolii-stage-pane/Cargo.toml` へ一緒に移した(motolii-shell からは直接
# 使わなくなった)。
motolii-stage-pane.workspace = true
# ζ 縫い目調査(docs/reviews/2026-08-21-browser-seam-survey.md)+裁定162 切片
# B0: Browser pane 骨格 crate。`pub use motolii_browser_pane as browser_pane;`
# (lib.rs)で他 pane と同じ命名口を張る。`Message::Browser(browser_pane::Message)`
# の腕は追加するが中身は無い match(`browser_pane::Message` がまだ空 enum の
# ため)——**`Shell::view` にはまだ組み込まない**(描画ゼロ = 挙動ゼロ変更の
# 証明、view 配線は B3 で絵と一緒に)。
motolii-browser-pane.workspace = true
# `--fixture --screenshot` 器具(screenshot.rs)が PNG を書き出すのに使う。iced の
# "image" feature が既に `image`(png codec 込み)を依存グラフへ引いているので、
# workspace の Cargo.toml 自身が既に明記している「裁定117 が許す direct 昇格」
# (notify と同じ扱い、R3 probe が先行昇格済み)であって新規の依存ではない。
image.workspace = true
# MB-1(File 束、裁定176)+第2波(2026-08-22、非同期化+Open/Import Media…/
# 書き出し先選択): New Project/Save As/Save a Copy/Open/Quit の path 選択・
# 破棄確認・素材取り込み/書き出し先の path 選択は native file dialog
# (`rfd::Async*Dialog`)。`file_dialogs.rs` の `FileDialogs` trait の production
# 実装(`RfdDialogs`)だけがこの crate を直接呼ぶ。
rfd.workspace = true
# 第6波 shell 結線(B09): Export 実行(`ExportJob`/`export_with_cancel`/
# `Cancel`)。workspace.dependencies に既存の alias があるのでそのまま使う。
motolii-export.workspace = true
# 同上。`motolii-export-pane`(ui/、B09 第1切片)はまだ workspace.dependencies
# に alias が無い(この波で初めて shell から使う)ので path 依存で足す —
# workspace の Cargo.toml(EXACT TARGET 外)は触らない。
motolii-export-pane = { path = "../../ui/motolii-export-pane" }

[dev-dependencies]
motolii-testkit.workspace = true
# タスク#15: iced_test spike + Q0横断柵。裁定170(M01)で本体 `iced` と同じ fork
# `oshikaidesu/iced` branch `motolii/host-seams`(rev 73e686ee)へ揃えた。
# 別revで放置すると本体と iced_test が別々の Selector/Candidate 型を持つ
# 2ライン共存事故になる(survey §2.4 item 4)ため、本体と常に同 rev で運用する。
# dev-only、shell の外へは出さない。
iced_test = { git = "https://github.com/oshikaidesu/iced", rev = "73e686ee05efd7d1b61cfea2647186b336d9ab9c" }
# 第2波(2026-08-22、File 束の rfd 非同期化): `Message::Xxx` が返す
# `iced::Task<Message>`(= `iced_runtime::task::Task`、`iced` crate は
# `pub use crate::runtime::task::{Handle, Task};` で再輸出しているだけの同じ
# 型)を試験から同期に汲み取るための `iced_runtime::task::into_stream`/
# `iced_runtime::Action` だけを使う(`tests/suite/file_drive.rs::drain_task`
# 冒頭 doc 参照)。`iced` 経由では `into_stream` が re-export されていない
# (`iced::task` は `Handle`/`Task` のみ再輸出、フォーク `src/lib.rs` 実測)ため
# 直接依存として足す ── 依存グラフには `iced`/`iced_test` 経由で既に同じ rev が
# 入っているので新規の依存ではない(裁定117 が許す direct 昇格と同型)。
# dev-only、shell の外へは出さない。
iced_runtime = { git = "https://github.com/oshikaidesu/iced", rev = "73e686ee05efd7d1b61cfea2647186b336d9ab9c" }
