[package]
name = "motolii-shell"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
iced.workspace = true
motolii-core.workspace = true
motolii-engine.workspace = true
motolii-media.workspace = true
motolii-store.workspace = true
# デザイン値の外出し(裁定117)。裁定160 切片1 で `tokens.rs` を crate 抽出、
# `pub use motolii_tokens_rs as tokens;`(lib.rs)で既存 `crate::tokens::` path を
# 維持する。`notify`/`serde`/`serde_json` は tokens.rs 専用の依存だったため、
# 抽出先の `motolii-tokens-rs/Cargo.toml` へ一緒に移した(motolii-shell からは
# 直接使わなくなった)。
motolii-tokens-rs.workspace = true
# 裁定160 切片9 で `settings_pane.rs`(+ 切片5 の `chrome.rs`)を crate 抽出、
# `pub use motolii_settings_pane as settings_pane;`(lib.rs)で既存
# `crate::settings_pane::` path を維持する。`chrome` は
# `pub(crate) use motolii_settings_pane::chrome;` で同様に再輸出する
# (本 crate 自身が引き続き読む、pane split survey §2.4)。
motolii-settings-pane.workspace = true
# 裁定160 切片7: `state.rs`(Session/KeySelector)を crate 抽出。
# `pub use motolii_shell_state as state;`(lib.rs)で既存 `crate::state::` path を
# 維持する(tokens と同じ手口)。
motolii-shell-state.workspace = true
# 裁定160 切片7: `timeline/` 9ファイル + 対応する write ロジックを crate 抽出。
# `pub use motolii_timeline_pane as timeline;`/`as timeline_pane;`(lib.rs)で
# 既存 path を維持する。
motolii-timeline-pane.workspace = true
# 裁定160 切片8 で `inspector_pane.rs`(+ 私法 Inspector ロジック233行)を crate
# 抽出、`pub use motolii_inspector_pane as inspector_pane;`(lib.rs)で既存
# `crate::inspector_pane::` path を維持する。
motolii-inspector-pane.workspace = true
# 裁定160 切片10: `stage.rs`(観測カメラ、裁定157)+ 対応する write ロジック
# (`observation_preview_source`)を crate 抽出。`pub use motolii_stage_pane as
# stage;`(lib.rs)で既存 `crate::stage::` path を維持する(tokens/timeline と
# 同じ手口)。`glam` は stage.rs 専用の直接依存だったため、抽出先の
# `motolii-stage-pane/Cargo.toml` へ一緒に移した(motolii-shell からは直接
# 使わなくなった)。
motolii-stage-pane.workspace = true
# `--fixture --screenshot` 器具(screenshot.rs)が PNG を書き出すのに使う。iced の
# "image" feature が既に `image`(png codec 込み)を依存グラフへ引いているので、
# workspace の Cargo.toml 自身が既に明記している「裁定117 が許す direct 昇格」
# (notify と同じ扱い、R3 probe が先行昇格済み)であって新規の依存ではない。
image.workspace = true

[dev-dependencies]
motolii-testkit.workspace = true
# タスク#15: iced_test spike + Q0横断柵。iced 0.14 と同一ラインの公式 crate
# (upstream iced-rs/iced、workspace の fork 版ではない — fork は tester/test rev
# 0.15.0-dev で next/ の iced 0.14 とは別線)。dev-only、shell の外へは出さない。
iced_test = "0.14"
