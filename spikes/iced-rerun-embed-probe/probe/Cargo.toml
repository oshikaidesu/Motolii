[package]
name = "iced-rerun-embed-probe"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# iced master(0.15.0-dev)。rev = 3de451447bd28217bb535632867550908e29d5d0
# (2026-08-18 時点の master HEAD)。crates.io の 0.14 は wgpu 27 で、
# Rerun fork(wgpu 29)と型が繋がらない。master の workspace.dependencies は
# `wgpu = "29"` を宣言しており、これが本 probe の前提そのものである。
#
# **git 依存にはできなかった**。iced master は `web-sys = "=0.3.85"` と完全一致で
# 釘を打っており、Rerun fork の `js-sys ^0.3.94` と cargo のグラフ上で同居できない
# (どちらも wasm32 でしか使われない依存なのに、cargo の解決はターゲットを問わない)。
# `../setup.sh` が上記 rev を `../vendor/iced` に取ってきて、その1行だけを
# `"0.3.85"` に緩める。経緯と再現手順は setup.sh と README.md にある。
iced = { path = "../vendor/iced", features = ["wgpu", "advanced"] }

# Rerun fork。camera seat(`SpatialStage::set_camera`)入りの rev。
re_chunk = { git = "https://github.com/oshikaidesu/rerun", rev = "483b855961c0ccab7ef3f3854a8f1b040422572c" }
re_log_types = { git = "https://github.com/oshikaidesu/rerun", rev = "483b855961c0ccab7ef3f3854a8f1b040422572c" }
re_renderer = { git = "https://github.com/oshikaidesu/rerun", rev = "483b855961c0ccab7ef3f3854a8f1b040422572c", default-features = false }
re_sdk_types = { git = "https://github.com/oshikaidesu/rerun", rev = "483b855961c0ccab7ef3f3854a8f1b040422572c" }
re_view_spatial = { git = "https://github.com/oshikaidesu/rerun", rev = "483b855961c0ccab7ef3f3854a8f1b040422572c", default-features = false }

# `SpatialStage::show` は egui の `Ui` を要求する。Rerun の絵を作る側は E0 と同じ
# 「headless egui Context」の手法をそのまま使う(新規に測るのは iced 側への持ち込みだけ)。
egui = "0.35"
egui-wgpu = "0.35"

# iced と Rerun が同じ wgpu を共有していることを型で確かめるため直接引く。
wgpu = "29"

# `Eye::pos_in_world` が返すのは **Rerun 側の glam(0.30)**。E0 と同じ理由でここだけ 0.30。
glam = "0.30"
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.4"
