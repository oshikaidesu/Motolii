[package]
name = "motolii-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

# 移植した Blitz パネル(Timeline / Browser / dock)をPNGに落とす道具。
# 見た目は決めず、既存実装が出すHTML/CSSをそのまま描くだけ。
[[bin]]
name = "motolii-blitz-dump"
path = "src/blitz_dump/main.rs"

# C7 の判定材料(Inspector の Blitz 写しをPNGにする)の実行体。sourceは inspector_blitz/ 内に置く。
[[bin]]
name = "motolii-inspector-blitz-dump"
path = "src/inspector_blitz/dump_main.rs"

# 移植済みパネルを1つの窓へ合体させて見るための殻(eframe host + Blitzテクスチャ + egui_tiles)。
# 入力もDocument接続も持たない。sourceは blitz_shell/ 内に置く。
[[bin]]
name = "motolii-blitz-shell"
path = "src/blitz_shell/main.rs"

# HTML/CSS を Blitz に食わせて計算済みの値(box・padding・border・margin・
# background/color/font/border-radius/gap)を JSON へ落とす抽出器具。
# GPU 不要 — layout だけ解いて読み戻す(描画しない)。sourceは css_metrics/ 内に置く。
[[bin]]
name = "motolii-css-metrics"
path = "src/css_metrics/main.rs"

[dependencies]
anyrender.workspace = true
anyrender_vello_hybrid.workspace = true
atomic_refcell.workspace = true
blitz-dom.workspace = true
blitz-html.workspace = true
blitz-net.workspace = true
blitz-paint.workspace = true
blitz-traits.workspace = true
eframe.workspace = true
keyboard-types.workspace = true
rustc-hash.workspace = true
tokio.workspace = true
vello_common.workspace = true
vello_hybrid.workspace = true
wgpu_context.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
egui_tiles.workspace = true
glam.workspace = true
# Browserパネルのサムネイル生成(`browser_blitz/thumbnail.rs`)。
# workspace 側は default-features = false / features = ["png"]。ここでは足さない。
image.workspace = true
lyon_path.workspace = true
lyon_tessellation.workspace = true
re_chunk.workspace = true
re_log_types.workspace = true
re_renderer.workspace = true
re_sdk_types.workspace = true
re_view_spatial.workspace = true
# New / Open の OS dialog。呼ぶのは `blitz_shell` の中だけ。
rfd.workspace = true
motolii-audio.workspace = true
motolii-core.workspace = true
motolii-doc.workspace = true
motolii-eval.workspace = true
motolii-export.workspace = true
motolii-gpu.workspace = true
motolii-input.workspace = true
# OS ドロップの取り込み(`probe_admission_source`)。CLI の import と同じ関数。
motolii-media.workspace = true
motolii-plugin.workspace = true
motolii-plugins-firstparty.workspace = true
motolii-render.workspace = true
motolii-transport.workspace = true
serde.workspace = true
serde_json.workspace = true
# css_metrics だけが使う。blitz-dom (0.3.0-beta.1) が固定する版と揃えてあり、
# cargo は既に取得済みの1個へ重複なく解決する — workspace 側には無いので直接指定。
style = { version = "0.19.0", package = "stylo" }
style_traits = { version = "0.19.0", package = "stylo_traits" }
taffy.workspace = true
thiserror.workspace = true
transform-gizmo.workspace = true
skia-safe.workspace = true
wgpu.workspace = true
winit.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["block2", "std", "NSEvent", "NSView", "NSWindow"] }

[dev-dependencies]
egui_kittest.workspace = true
motolii-testkit.workspace = true
syn = { version = "2", features = ["full", "visit"] }
