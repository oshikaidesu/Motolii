<style>
#ease-readable{--ep-bg:light-dark(#f0efec,#292a2b);--ep-surface:light-dark(#fffefb,#343638);--ep-ink:light-dark(#272c2d,#eceeeb);--ep-muted:light-dark(#606965,#b4bcb7);--ep-line:light-dark(#d4d7d0,#4b504e);--ep-paper:#b7d8d1;--ep-dark:#203f39;--ep-accent:#b7d8d1;--ep-card:light-dark(#f8f8f4,#303332);font:12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ep-ink);width:100%;display:flex;justify-content:center;padding:12px 0;box-sizing:border-box}
#ease-readable *{box-sizing:border-box}#ease-readable button,#ease-readable input{font:inherit}#ease-readable button{cursor:pointer;color:inherit}#ease-readable button:focus-visible,#ease-readable input:focus-visible{outline:2px solid var(--ep-accent);outline-offset:2px}#ease-readable .ep-window{width:min(100%,380px);background:var(--ep-bg);border:1px solid var(--ep-line);border-radius:8px;overflow:hidden}#ease-readable .ep-bar{height:32px;display:flex;align-items:center;padding:0 10px;border-bottom:1px solid var(--ep-line);gap:8px}#ease-readable .ep-bar strong{font-size:12px;font-weight:600}#ease-readable .ep-concept{font-size:10px;letter-spacing:.06em;color:var(--ep-muted);margin-left:auto}#ease-readable .ep-content{padding:10px}#ease-readable .ep-edit{display:grid;grid-template-columns:132px minmax(0,1fr);gap:12px}#ease-readable .ep-graph{display:block;width:132px;height:132px;background:var(--ep-paper);border-radius:4px;touch-action:none}#ease-readable .ep-info{display:flex;flex-direction:column;min-width:0}#ease-readable .ep-name{font-size:14px;font-weight:650;line-height:19px;margin:0}#ease-readable .ep-meaning{font-size:11px;line-height:16px;color:var(--ep-muted);min-height:32px;margin-top:2px}#ease-readable .ep-motion{height:29px;display:flex;align-items:center;gap:8px}#ease-readable .ep-play{width:24px;height:24px;display:grid;place-items:center;flex-shrink:0;border:1px solid var(--ep-line);border-radius:4px;background:var(--ep-surface);padding:0}#ease-readable .ep-play svg{width:12px;height:12px}#ease-readable .ep-runway{position:relative;height:24px;flex:1;overflow:visible}#ease-readable .ep-runway:before{content:'';height:1px;background:var(--ep-line);position:absolute;left:6px;right:6px;top:12px}#ease-readable .ep-runway:after{content:'';position:absolute;right:6px;top:8px;height:9px;width:1px;background:var(--ep-muted)}#ease-readable .ep-ball{position:absolute;left:0;top:6px;width:12px;height:12px;border-radius:50%;background:var(--ep-accent);border:1px solid var(--ep-dark)}#ease-readable .ep-fields{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px;margin-top:auto;min-height:43px}#ease-readable .ep-field{display:flex;align-items:center;gap:4px;min-width:0;font-size:10px;color:var(--ep-muted)}#ease-readable .ep-field span{white-space:nowrap;flex:1}#ease-readable .ep-field input{width:43px;min-width:0;height:20px;border:0;border-bottom:1px solid var(--ep-line);background:var(--ep-surface);color:var(--ep-ink);font-size:11px;text-align:right;padding:2px 4px;border-radius:2px;appearance:textfield}#ease-readable .ep-fields .ep-range{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;color:var(--ep-muted);font-size:11px}#ease-readable .ep-keyboard{font-size:10px;color:var(--ep-muted)}#ease-readable .ep-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-top:10px}#ease-readable .ep-preset{height:66px;border:1px solid transparent;border-radius:4px;background:var(--ep-card);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px 4px;gap:1px}#ease-readable .ep-preset:hover{border-color:var(--ep-muted);background:var(--ep-surface)}#ease-readable .ep-preset[aria-pressed=true]{background:var(--ep-paper);color:var(--ep-dark);border-color:var(--ep-paper)}#ease-readable .ep-mini{width:44px;height:44px;display:block;flex-shrink:0}#ease-readable .ep-label{font-size:11px;line-height:14px;font-weight:500;white-space:nowrap}#ease-readable .ep-footer{display:flex;align-items:center;gap:4px;margin-top:8px;height:26px}#ease-readable .ep-icon{width:26px;height:26px;padding:5px;display:grid;place-items:center;border:0;background:transparent;border-radius:4px;color:var(--ep-muted)}#ease-readable .ep-icon:hover{background:var(--ep-surface);color:var(--ep-ink)}#ease-readable .ep-icon svg{width:15px;height:15px}#ease-readable .ep-status{margin-left:4px;font-size:10px;color:var(--ep-muted);flex:1}#ease-readable .ep-apply{height:25px;padding:0 12px;background:var(--ep-paper);border:0;border-radius:4px;color:var(--ep-dark);font-weight:600;font-size:11px}#ease-readable .ep-check{font-size:10px;display:flex;align-items:center;gap:4px;color:var(--ep-muted);margin-right:5px}#ease-readable .ep-check input{width:12px;height:12px;accent-color:#81b3a6;margin:0}#ease-readable .ep-plot-label{fill:var(--ep-dark);font:9px -apple-system,BlinkMacSystemFont,sans-serif;opacity:.8}#ease-readable .ep-curve{fill:none;stroke:var(--ep-dark);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}#ease-readable .ep-handle{fill:var(--ep-dark);stroke:var(--ep-paper);stroke-width:2;cursor:grab}#ease-readable .ep-handle:active{cursor:grabbing}
@media(max-width:350px){#ease-readable .ep-edit{grid-template-columns:118px minmax(0,1fr);gap:8px}#ease-readable .ep-graph{width:118px;height:118px}#ease-readable .ep-content{padding:8px}#ease-readable .ep-meaning{min-height:28px;font-size:11px;line-height:14px}#ease-readable .ep-name{font-size:13px}#ease-readable .ep-fields{min-height:40px;gap:2px 4px}#ease-readable .ep-field input{width:38px}}
</style>
<div id="ease-readable">
 <section class="ep-window" aria-label="Ease design preview">
  <header class="ep-bar"><i data-lucide="spline" aria-hidden="true"></i><strong>Ease</strong><span class="ep-concept">DESIGN PREVIEW</span></header>
  <div class="ep-content">
   <div class="ep-edit">
    <svg class="ep-graph" viewBox="0 0 132 132" role="img" aria-label="Selected easing curve; horizontal axis time, vertical axis value"></svg>
    <section class="ep-info" aria-label="Curve behavior and adjustment">
     <h2 class="ep-name">Bezier</h2><div class="ep-meaning" aria-live="polite">A soft start and a soft finish.</div>
     <div class="ep-motion"><button class="ep-play" aria-label="Preview this motion" data-tooltip="Preview motion"><i data-lucide="play" aria-hidden="true"></i></button><div class="ep-runway" aria-label="Motion preview from start to finish"><span class="ep-ball"></span></div></div>
     <div class="ep-fields"></div>
    </section>
   </div>
   <div class="ep-grid" role="group" aria-label="Choose a curve"></div>
   <footer class="ep-footer">
    <button class="ep-icon ep-copy" aria-label="Copy curve" data-tooltip="Copy curve"><i data-lucide="copy" aria-hidden="true"></i></button>
    <button class="ep-icon ep-save" aria-label="Save preset" data-tooltip="Save preset"><i data-lucide="bookmark-plus" aria-hidden="true"></i></button>
    <span class="ep-status" aria-live="polite">2 keys selected</span>
    <label class="ep-check"><input type="checkbox" class="ep-overshoot">Overshoot</label>
    <button class="ep-apply">Apply</button>
   </footer>
  </div>
 </section>
</div>
<script>
(()=>{
 const root=document.getElementById('ease-readable');
 const $=s=>root.querySelector(s);
 const state={width:380,curveSize:132,accent:'#b7d8d1',selected:2,preview:2,x1:.42,y1:0,x2:.58,y2:1,playing:0,clip:null,saved:[],overshoot:false};
 const descriptions=[
  ['Hold','Wait, then change in one jump.'],['Linear','Move at a constant pace.'],['Bezier','Shape the start and finish.'],
  ['Bounce','Reach the end, then rebound.'],['Elastic','Pass the end and spring back.'],['Cyclic','Repeat a wave as time advances.'],
  ['Random','Vary the pace irregularly.'],['Steps','Move through distinct levels.'],['Elastic Steps','Spring into each new level.']
 ];
 const randomPoints=[0,.09,.025,.27,.19,.41,.37,.22,.68,.55,.81,.70,.89,.82,1];
 function bezier(t,a,b){let lo=0,hi=1,u=t;for(let n=0;n<15;n++){u=(lo+hi)/2;let x=3*(1-u)*(1-u)*u*state.x1+3*(1-u)*u*u*state.x2+u*u*u;if(x<t)lo=u;else hi=u;}return 3*(1-u)*(1-u)*u*a+3*(1-u)*u*u*b+u*u*u;}
 function sample(k,t){t=Math.max(0,Math.min(1,t));if(t===0)return 0;if(t===1)return 1;switch(k){case 0:return 0;case 1:return t;case 2:return bezier(t,state.y1,state.y2);case 3:{let n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d){t-=1.5/d;return n*t*t+.75;}if(t<2.5/d){t-=2.25/d;return n*t*t+.9375;}t-=2.625/d;return n*t*t+.984375;}case 4:return 1-Math.exp(-6*t)*Math.cos(5*Math.PI*t);case 5:return t+.16*Math.sin(6*Math.PI*t);case 6:{let p=t*(randomPoints.length-1),i=Math.floor(p);return randomPoints[i]+(randomPoints[Math.min(i+1,randomPoints.length-1)]-randomPoints[i])*(p-i);}case 7:return Math.floor(t*5)/5;case 8:{let p=t*4,i=Math.floor(p),f=p-i;return (i+1-Math.exp(-5*f)*Math.cos(3*Math.PI*f))/4;}}}
 function domain(k){let vals=Array.from({length:161},(_,i)=>sample(k,i/160));return [Math.min(0,...vals)-.035,Math.max(1,...vals)+.035];}
 function path(k,size,pad){let [lo,hi]=domain(k);let points=Array.from({length:161},(_,i)=>{let t=i/160;return [(pad+t*(size-2*pad)).toFixed(2),(size-pad-(sample(k,t)-lo)/(hi-lo)*(size-2*pad)).toFixed(2)];});return points.map((p,i)=>(i?'L':'M')+p.join(',')).join(' ');}
 function graph(k){let [lo,hi]=domain(k),p=(x,y)=>[15+x*102,117-(y-lo)/(hi-lo)*102];let grid='';for(let i=0;i<5;i++){let a=p(i/4,0),b=p(i/4,1),c=p(0,i/4),d=p(1,i/4);grid+=`<path d="M${a}L${b}M${c}L${d}" stroke="#203f39" stroke-opacity=".13" fill="none"/>`;}
 let handles='';if(k===2){const a=p(0,0),b=p(state.x1,state.y1),c=p(1,1),d=p(state.x2,state.y2);handles=`<path d="M${a}L${b}M${c}L${d}" fill="none" stroke="#203f39" stroke-opacity=".42"/>`+[b,d].map((v,i)=>`<circle class="ep-handle" data-handle="${i}" cx="${v[0]}" cy="${v[1]}" r="5.5"/>`).join('');}
 $('.ep-graph').innerHTML=grid+`<path class="ep-curve" d="${path(k,132,15)}"/>`+handles+`<text x="16" y="129" class="ep-plot-label">0</text><text x="66" y="129" text-anchor="middle" class="ep-plot-label">Time</text><text x="116" y="129" text-anchor="end" class="ep-plot-label">1</text><text x="5" y="12" class="ep-plot-label">Value</text>`;
 }
 function fields(k){if(k===2){$('.ep-fields').innerHTML=['x1','y1','x2','y2'].map(key=>`<label class="ep-field"><span>${key.toUpperCase()}</span><input type="number" step="0.01" min="${key[0]==='x'||!state.overshoot?0:-1}" max="${key[0]==='x'||!state.overshoot?1:2}" value="${state[key].toFixed(2)}" data-key="${key}" aria-label="Bezier ${key}"></label>`).join('');$('.ep-fields').querySelectorAll('input').forEach(input=>input.oninput=()=>{const v=Number(input.value);if(!Number.isFinite(v))return;state[input.dataset.key]=Math.min(Number(input.max),Math.max(Number(input.min),v));graph(2);drawTiles();});}else{$('.ep-fields').innerHTML='<div class="ep-range"><span>Start</span><span>→</span><span>Finish</span></div>';}}
 function drawTiles(){root.querySelectorAll('.ep-preset').forEach((button,k)=>{button.setAttribute('aria-pressed',String(k===state.selected));button.querySelector('path').setAttribute('d',path(k,44,4));});}
 function display(k){state.preview=k;$('.ep-name').textContent=descriptions[k][0];$('.ep-meaning').textContent=descriptions[k][1];graph(k);fields(k);}
 function play(k){cancelAnimationFrame(state.playing);const start=performance.now();const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;function tick(now){let t=reduced?1:Math.min(1,(now-start)/1200);const w=Math.max(0,$('.ep-runway').clientWidth-12);$('.ep-ball').style.transform=`translateX(${sample(k,t)*w}px)`;if(t<1)state.playing=requestAnimationFrame(tick);}tick(start);}
 $('.ep-grid').innerHTML=descriptions.map(([name,desc],i)=>`<button class="ep-preset" aria-label="${name}: ${desc}" aria-pressed="${i===state.selected}" data-tooltip="${desc}"><svg class="ep-mini" viewBox="0 0 44 44" role="img" aria-label="${name} curve"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg><span class="ep-label">${name}</span></button>`).join('');
 root.querySelectorAll('.ep-preset').forEach((button,i)=>{button.onclick=()=>{state.selected=i;display(i);drawTiles();play(i);$('.ep-status').textContent='2 keys selected';};button.onmouseenter=()=>{display(i);play(i);};button.onmouseleave=()=>{display(state.selected);cancelAnimationFrame(state.playing);$('.ep-ball').style.transform='translateX(0)';};button.onfocus=()=>display(i);button.onblur=()=>display(state.selected);});
 $('.ep-play').onclick=()=>play(state.preview);
 $('.ep-copy').onclick=()=>{state.clip={kind:descriptions[state.selected][0],x1:state.x1,y1:state.y1,x2:state.x2,y2:state.y2};$('.ep-status').textContent='Curve copied';};
 $('.ep-save').onclick=()=>{state.saved.push({kind:descriptions[state.selected][0],x1:state.x1,y1:state.y1,x2:state.x2,y2:state.y2});$('.ep-status').textContent=`${state.saved.length} preset saved`;};
 $('.ep-apply').onclick=()=>{$('.ep-status').textContent='Applied in preview';};
 $('.ep-overshoot').onchange=e=>{state.overshoot=e.target.checked;if(!state.overshoot){state.y1=Math.max(0,Math.min(1,state.y1));state.y2=Math.max(0,Math.min(1,state.y2));}display(state.selected);drawTiles();};
 let drag=null;$('.ep-graph').onpointerdown=e=>{const handle=e.target.closest('[data-handle]');if(!handle)return;drag=Number(handle.dataset.handle);$('.ep-graph').setPointerCapture(e.pointerId);};
 $('.ep-graph').onpointermove=e=>{if(drag===null)return;const r=$('.ep-graph').getBoundingClientRect(),[lo,hi]=domain(2);let x=(e.clientX-r.left)*132/r.width,y=(e.clientY-r.top)*132/r.height;state[drag?'x2':'x1']=Math.max(0,Math.min(1,(x-15)/102));state[drag?'y2':'y1']=Math.max(state.overshoot?-1:0,Math.min(state.overshoot?2:1,lo+(117-y)/102*(hi-lo)));graph(2);fields(2);drawTiles();};
 $('.ep-graph').onpointerup=()=>{drag=null;play(2);};$('.ep-graph').onpointercancel=()=>{drag=null;};
 function render(){root.querySelector('.ep-window').style.width=`min(100%,${state.width}px)`;root.style.setProperty('--ep-paper',state.accent);root.style.setProperty('--ep-accent',state.accent);display(state.selected);drawTiles();}
 render();
 if(globalThis.Tweak){const tweak=new Tweak({container:root.querySelector('.ep-window'),onChange:render});tweak.addSlider(state,'width',{label:'Window width',min:320,max:440,step:10,unit:'px'});tweak.addColorPicker(state,'accent',{label:'Graph surface',reference:'--ep-paper'});}
})();
</script>
<style>
#ease-readable .ep-field input::-webkit-inner-spin-button,#ease-readable .ep-field input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
</style>
